[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iss-eden-fair-biomass"
version = "1.0.0"
description = "FAIR data repository and visualization tools for the EDEN ISS Antarctic Space Greenhouse crop biomass dataset (NASA OSDR OSD-895)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "EDEN ISS Research Group & Open Science Contributors"}
]
keywords = [
  "space-biology",
  "controlled-environment-agriculture",
  "space-greenhouse",
  "bioregenerative-life-support",
  "eden-iss",
  "nasa-osdr",
  "fair-data"
]
dependencies = [
  "pandas>=2.0.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "frictionless>=5.0.0"
]

[project.urls]
Homepage = "https://osdr.nasa.gov/bio/repo/data/studies/OSD-895"
Documentation = "https://doi.org/10.3389/fpls.2020.00656"
Repository = "https://github.com/your-username/ISS_EDEN"
