name: Validate FAIR Data & Schemas

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install frictionless

      - name: Validate Frictionless Data Package
        run: |
          frictionless validate data/metadata/datapackage.json

      - name: Verify Processed CSV & JSON Integrity
        run: |
          python3 scripts/process_data.py
          git diff --exit-code data/processed/
